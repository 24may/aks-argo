name: Terraform Validate

on:
  # Runs on every push to any branch, but only when Terraform-related files
  # actually changed - this is the first stage of the pipeline: validate ->
  # (on a develop -> main PR) plan -> apply.
  push:
    branches: ['**']
    paths:
      - '**/*.tf'
      - 'envs/**/*.tfvars'
      - 'envs/**/*.hcl'
      - '.github/workflows/terraform-*.yml'
  pull_request:
    paths:
      - '**/*.tf'
      - 'envs/**/*.tfvars'
      - 'envs/**/*.hcl'
      - '.github/workflows/terraform-*.yml'

permissions:
  contents: read
  security-events: write

concurrency:
  group: terraform-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    #runs-on: ubuntu-latest
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (backend=false для быстрой проверки)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: tflint --init && tflint -f compact

      # - name: Security scan (Checkov)
      #   uses: bridgecrewio/checkov-action@v12.3113.0
      #   with:
      #     directory: .
      #     framework: terraform
      #     soft_fail: true   # true пока не готовы блокировать PR, потом false
      - name: Install Checkov
        run: pip3 install checkov

      - name: Run Checkov
        run: |
          checkov -d . \
            --framework terraform \
            --soft-fail \
            --output sarif \
            --output-file-path results.sarif

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Security scan (tfsec, опционально/дублирует checkov)
        uses: aquasecurity/tfsec-action@v1.0.3